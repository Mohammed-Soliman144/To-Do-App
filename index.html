<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App</title>
    <meta
      name="description"
      content="Organize your tasks in one place which you can add, remove, filteration and select completed tasks"
    />
    <meta name="keywords" content="HTML5 | CSS3 | JS | LocalStorage" />
    <meta name="author" content="muhammed soliman" />
    <link
      rel="canonical"
      href="https://mohammed-soliman144.github.io/To-Do-App"
    />
    <link rel="stylesheet" href="./src/styles/globals.css" />
    <script type="module" src="./src/js/main.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="container">
        <section class="todo-app">
          <header class="todo-app__header header">
            <h1 class="header__heading heading">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="icon checked-icon"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                />
              </svg>
              <span class="heading__title">my tasks</span>
            </h1>
            <time class="header__date" datetime="2026-11-10"
              >Tuesday, November 10</time
            >
          </header>
          <form method="GET" class="todo-app__form form" novalidate>
            <div class="form__form-group form-group">
              <label for="task-title" class="sr-only">Task Title:</label>
              <input
                class="form__input input"
                type="text"
                name="task-title"
                id="task-title"
                placeholder="What do you need to do?"
                minlength="5"
                maxlength="50"
                autocomplete="off"
              />
              <div class="form-controls">
                <button
                  class="button__submit"
                  type="submit"
                  aria-label="add your task to app"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="button__icon icon plus-icon"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 4.5v15m7.5-7.5h-15"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <nav class="todo-app__filter filter">
              <ul class="filter__list list" aria-label="filter your tasks">
                <li class="filter__list-item list-item" aria-current="true">
                  <a href="#all" class="list-item__link link--active">all</a>
                </li>
                <li class="filter__list-item list-item" aria-current="false">
                  <a href="#active" class="list-item__link">active</a>
                </li>
                <li class="filter__list-item list-item" aria-current="false">
                  <a href="#completed" class="list-item__link">completed</a>
                </li>
              </ul>
            </nav>
            <ul class="todo-app__task-list task-list list">
              <li class="task-list__list-item list-item--empty">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="list-item__icon icon checklist-icon"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                  <path
                    d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                  />
                  <path d="M12 11h4" />
                  <path d="M12 16h4" />
                  <path d="M8 11h.01" />
                  <path d="M8 16h.01" />
                </svg>
                <span class="list-item__text text"> no tasks here yet </span>
              </li>
            </ul>
            <footer class="todo-app__footer footer">
              <p class="footer__content content">
                <span class="content__text" id="remain-items">2</span>
                items left
              </p>
              <button class="footer__button button clear-button" type="button">
                clear completed
              </button>
            </footer>
          </form>
        </section>
      </div>
      <template id="temp-list-item" class="temp-list-item">
        <li class="task-list__list-item list-item">
          <div class="list-item__wrapper">
            <input
              class="list-item__input"
              type="checkbox"
              name="checkbox"
              id="checkbox"
            />
            <label class="list-item__label" for="checkbox">go to gym</label>
          </div>
          <div class="form-controls">
            <button class="button__edit" type="button">
              <span class="sr-only">edit task</span>
              <svg
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="button__icon icon edit-icon"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
                />
              </svg>
            </button>
            <button type="button" class="button__delete">
              <span class="sr-only">delete task</span>
              <svg
                aria-hidden="true"
                focuable="false"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="button__icon icon delete-icon"
              >
                <path
                  class="child"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18 18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </li>
      </template>
      <template id="temp-empty-list-item" class="temp-empty-list-item">
        <li class="task-list__list-item list-item--empty">
          <svg
            aria-hidden="true"
            focuable="false"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="list-item__icon icon checklist-icon"
            aria-hidden="true"
            focusable="false"
          >
            <rect
              class="child"
              width="8"
              height="4"
              x="8"
              y="2"
              rx="1"
              ry="1"
            />
            <path
              class="child"
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            />
            <path class="child" d="M12 11h4" />
            <path class="child" d="M12 16h4" />
            <path class="child" d="M8 11h.01" />
            <path class="child" d="M8 16h.01" />
          </svg>
          <span class="list-item__text text"> no tasks here yet </span>
        </li>
      </template>
    </main>
  </body>
</html>
